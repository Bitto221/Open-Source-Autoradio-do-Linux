# Automatické přihlášení na tty1 bez hesla - potřeba pro to, aby appka
# naskočila hned po startu desky, bez ručního přihlašování.
# Instaluje se jako /etc/systemd/system/getty@tty1.service.d/override.conf
# (viz install-kiosk.sh, který dosadí skutečné jméno uživatele).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin __USERNAME__ --noclear %I $TERM
